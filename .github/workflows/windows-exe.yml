name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build external SAP BCP console test client
        shell: pwsh
        run: |
          ./scripts/build_sap_test_clients.ps1
          "NICE_TOOLS_SAP_TEST_CLIENTS=$((Resolve-Path build/sap-test-clients).Path)" >> $env:GITHUB_ENV
      - name: Run source tests
        shell: pwsh
        run: python scripts/run_source_tests.py --timeout 300
      - name: Verify Java Jasypt interoperability
        shell: pwsh
        run: python scripts/check_jasypt_java.py --java "$env:JAVA_HOME_17_X64\bin\java.exe"
      - name: Build and verify the single executable
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SapTestClients "$env:NICE_TOOLS_SAP_TEST_CLIENTS"
      - name: Upload the verified executable
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nice-tools-windows-x64
          path: dist/nice-tools.exe
          if-no-files-found: error
          retention-days: 14
